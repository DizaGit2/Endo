name: ci-backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "client/openapi/**"
      - "deploy/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "client/openapi/**"
      - "deploy/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # OpenAPI contract drift guard (no docker required)
  # Boots the API in-process and asserts:
  #   live backend == backend/contract/openapi.json == client/openapi/lumen.openapi.json
  # Triggers on any backend change OR a change to the pinned client spec.
  # -------------------------------------------------------------------------
  openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: OpenAPI snapshot / contract drift guard
        run: dotnet test backend/Lumen.slnx --filter "FullyQualifiedName~OpenApi" --nologo

  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build (warnings as errors)
        run: dotnet build backend/Lumen.slnx -warnaserror --nologo
      - name: Unit tests
        run: dotnet test backend/tests/Lumen.UnitTests --no-build --nologo --logger trx --results-directory TestResults/unit
      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-unit
          path: TestResults/unit
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Start infra (Postgres + Vault + Keycloak)
        run: docker compose -f deploy/docker-compose.yml up -d postgres vault vault-init keycloak

      - name: Wait for Keycloak realm import
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/realms/lumen/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "keycloak realm up"; break; fi
            sleep 2
          done

      - name: Wait for Vault Transit key
        run: |
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml exec -T vault \
                 sh -lc 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault read transit/keys/lumen-dev-kek' >/dev/null 2>&1 && \
               docker compose -f deploy/docker-compose.yml exec -T vault \
                 sh -lc 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault read transit/keys/lumen-dev-email-hmac' >/dev/null 2>&1; then
              echo "vault transit keys present"; break; fi
            sleep 2
          done

      - name: Apply EF migrations
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          export PATH="$PATH:$HOME/.dotnet/tools"
          # dotnet ef does not restore on its own; build (which restores) first so the
          # assets file exists, then apply migrations against the already-built output.
          dotnet build backend/src/Lumen.Infrastructure --nologo
          dotnet ef database update --no-build \
            --project backend/src/Lumen.Infrastructure \
            --startup-project backend/src/Lumen.Infrastructure

      - name: Integration tests (against the compose stack)
        run: >
          dotnet test backend/tests/Lumen.IntegrationTests --nologo --logger trx
          --settings backend/coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: Security/GDPR tests
        if: always()
        run: >
          dotnet test backend/tests/Lumen.SecurityTests --nologo --logger trx
          --settings backend/coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults/security

      # The unit suite runs in build-and-unit too; it is repeated here (6 s) purely so all three
      # suites' coverage lands in ONE results tree. Gating on the live suites alone would measure a
      # denominator the unit tests cover most of, and report a number nobody could act on.
      - name: Unit tests (for the coverage denominator)
        run: >
          dotnet test backend/tests/Lumen.UnitTests --nologo
          --settings backend/coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit-coverage

      # A self-contained .NET 10 file-based app merges the three cobertura reports and splits the
      # denominator BY PATH (never a glob — see the file's header and the P3a client bug it cites).
      # Fails the job if coverage on HAND-WRITTEN backend/src is below 70% (plan G15); the whole-tree
      # figure is always printed beside it so 97% is never mistaken for whole-tree coverage.
      - name: Backend coverage gate
        run: dotnet run backend/tools/check-coverage.cs -- TestResults

      - name: Upload integration/security test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-integration
          path: TestResults
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 100
