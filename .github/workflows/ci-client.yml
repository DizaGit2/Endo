name: ci-client

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - "backend/contract/openapi.json"
      - ".github/workflows/ci-client.yml"
  pull_request:
    paths:
      - "client/**"
      - "backend/contract/openapi.json"
      - ".github/workflows/ci-client.yml"

concurrency:
  group: ci-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Java is harmless on Linux and covers any native-asset hook that needs it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: pub get
        working-directory: client
        run: flutter pub get

      # -----------------------------------------------------------------------
      # Spec-sync drift guard
      # The pinned client spec must be byte-identical to the committed backend
      # contract. (The backend OpenApiSnapshotTests job enforces live↔committed;
      # this step enforces committed↔pinned-client.)
      # -----------------------------------------------------------------------
      - name: Assert spec files are byte-identical
        run: |
          if ! cmp -s backend/contract/openapi.json client/openapi/lumen.openapi.json; then
            echo "ERROR: backend/contract/openapi.json and client/openapi/lumen.openapi.json have diverged."
            echo "Run the backend OpenApiSnapshotTests with LUMEN_OPENAPI_UPDATE=1 to refresh both files."
            diff backend/contract/openapi.json client/openapi/lumen.openapi.json || true
            exit 1
          fi
          echo "Spec files match — no drift detected."

      - name: flutter analyze
        working-directory: client
        run: flutter analyze

      - name: flutter test --coverage
        working-directory: client
        run: flutter test --coverage

      # -----------------------------------------------------------------------
      # Coverage gate >= 60% (generated code excluded)
      # A self-contained Dart script parses coverage/lcov.info directly and
      # excludes lib/api/** + *.g.dart (deterministic, no lcov-version glob
      # quirks). Fails the job if line coverage on hand-written code is < 60%.
      # -----------------------------------------------------------------------
      - name: Coverage gate (>=60%, generated client excluded)
        working-directory: client
        run: dart run tool/check_coverage.dart

      # -----------------------------------------------------------------------
      # Timezone-sensitive tests, re-run on a positive-offset DST zone (P4b-T17b)
      #
      # ⚠ STATUS: UNCONFIRMED — this step is NOT yet a control.
      # It has never been observed to go red. The plan requires a deliberate
      # red (put `.subtract(const Duration(days: 1))` back in `_dayWindow`,
      # push, watch this fail) before it may be cited as evidence of anything.
      # That could not be done on the branch that added it: the branch had no
      # upstream and CI had never run. Until someone does it and records the
      # result, treat a green here as "the step executed", not "the DST
      # behaviour is pinned".
      #
      # WHAT IT IS FOR. Three P4b tests are unprovable on the primary dev
      # machine (Windows, UTC−6, no DST since 2022):
      #   * `dashboard_controller_test.dart`'s "yesterday is computed by
      #     CALENDAR arithmetic" test (T17) needs a DST-observing zone;
      #   * `symptoms_repository_test.dart`'s `fallbackDay` non-normalisation
      #     test (T19) is observable only on a POSITIVE-offset machine;
      #   * `symptoms_repository_test.dart`'s explicit-`occurredAt` UTC-anchor
      #     test (T17b) discriminates on any non-zero offset, and on a
      #     positive one it exercises the opposite sign from the dev machine.
      # Madrid is UTC+1/+2 and observes DST, so one zone covers all three.
      # `duration_days_guard_test.dart` is zone-independent and is here only
      # because it is the source-level half of the same rule.
      #
      # Dart on Linux resolves local time through the C library and DOES read
      # `TZ`; Dart on Windows does not — and worse, setting `TZ` there moves
      # the reported offset to 0 while keeping the machine's own zone NAME, so
      # a local "verification" silently runs on a UTC-flavoured clock. That is
      # what `tool/tz_probe.dart` exists to catch: it asserts the offset is
      # actually Madrid's BEFORE the tests run, so if the runner ignores `TZ`
      # this step fails loudly instead of passing while proving nothing.
      # -----------------------------------------------------------------------
      - name: Timezone-sensitive tests (TZ=Europe/Madrid) — UNCONFIRMED control
        working-directory: client
        env:
          TZ: Europe/Madrid
        run: |
          dart run tool/tz_probe.dart
          flutter test \
            test/core/time/duration_days_guard_test.dart \
            test/features/home/dashboard_controller_test.dart \
            test/features/symptoms/data/symptoms_repository_test.dart

      - name: Upload failure artifacts (coverage + golden diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-failure-artifacts
          path: |
            client/coverage/lcov.info
            client/test/**/failures/**
          if-no-files-found: ignore
