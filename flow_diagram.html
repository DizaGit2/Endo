<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — Screen flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s;}
body[data-theme="light"]{
  --bg:#F1EFE8;--surface:#FFFCF7;--ink:#3B2A20;--mut:#8A6F5E;
  --ac:#C25A36;--acs:#F3D9CC;--sg:#7B8F6B;--sgs:#E4EADD;
  --bd:rgba(59,42,32,.12);--in:#FAF6EF;
  --group-bg:#FFFCF7;--arrow:#C25A36;
  --home-clr:#C25A36;--cycle-clr:#D4537E;--hormones-clr:#7B8F6B;--body-clr:#B8963E;--more-clr:#8A6F5E;--onboard-clr:#A0917E;
}
body[data-theme="dark"]{
  --bg:#1A1220;--surface:#241830;--ink:#F2E4D4;--mut:#A99BB8;
  --ac:#E8A87C;--acs:#3A2438;--sg:#9BAE85;--sgs:#28321F;
  --bd:rgba(242,228,212,.12);--in:#1F1428;
  --group-bg:#1E1528;--arrow:#E8A87C;
  --home-clr:#E8A87C;--cycle-clr:#E89AB8;--hormones-clr:#9BAE85;--body-clr:#D4B86A;--more-clr:#A99BB8;--onboard-clr:#8A7B9E;
}
body{background:var(--bg);color:var(--ink);}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--bd);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:18px;font-weight:500;letter-spacing:-0.3px;}
.toggle-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--ink);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.toggle-btn:hover{border-color:var(--ac);}
.diagram-wrap{padding:24px;overflow-x:auto;}
svg{display:block;margin:0 auto;}
svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

/* Hover highlight system */
#flow.dimmed .section,
#flow.dimmed .flow-group,
#flow.dimmed .hub{opacity:0.12;transition:opacity .2s;}
#flow .section,#flow .flow-group,#flow .hub{transition:opacity .2s;}
#flow.dimmed .highlighted{opacity:1 !important;}

/* Legend */
.legend{display:flex;gap:20px;align-items:center;justify-content:center;padding:12px 24px;font-size:11px;color:var(--mut);}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-swatch{width:20px;height:10px;border-radius:3px;border:2px solid;}
.legend-line{width:20px;height:0;border-top:2px solid var(--ac);}
.legend-dash{width:20px;height:0;border-top:2px dashed var(--mut);}
</style>
</head>
<body data-theme="light">

<script>
function toggleTheme() {
  var next = (document.body.dataset.theme === 'light') ? 'dark' : 'light';
  document.body.dataset.theme = next;
  document.getElementById('theme-toggle').textContent = next === 'light' ? '\u263E' : '\u2600';
}

// Hover highlight system
var svg = document.getElementById('flow');
var allInteractive = svg.querySelectorAll('.section, .flow-group, .hub');

function highlight(sectionId) {
  svg.classList.add('dimmed');
  // Highlight hovered element
  var el = svg.querySelector('[data-section="' + sectionId + '"]');
  if (el) el.classList.add('highlighted');
  // Highlight connected flows and their connected sections
  svg.querySelectorAll('.flow-group').forEach(function(flow) {
    var connects = (flow.dataset.connects || '').split(',');
    if (connects.indexOf(sectionId) !== -1) {
      flow.classList.add('highlighted');
      connects.forEach(function(sid) {
        var target = svg.querySelector('[data-section="' + sid + '"]');
        if (target) target.classList.add('highlighted');
      });
    }
  });
}

function unhighlight() {
  svg.classList.remove('dimmed');
  svg.querySelectorAll('.highlighted').forEach(function(el) {
    el.classList.remove('highlighted');
  });
}

allInteractive.forEach(function(el) {
  el.style.cursor = 'pointer';
  el.addEventListener('mouseenter', function() {
    var section = el.dataset.section;
    if (!section && el.dataset.connects) {
      // For flow-group, highlight first connected section
      section = el.dataset.connects.split(',')[0];
    }
    if (section) highlight(section);
  });
  el.addEventListener('mouseleave', unhighlight);
});
</script>
