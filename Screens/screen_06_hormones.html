#s6[data-theme="dark"]{--b:#1A1220;--f:#241830;--ink:#F2E4D4;--mut:#A99BB8;--ac:#E8A87C;--acs:#3A2438;--sg:#9BAE85;--bd:rgba(242,228,212,.12);--in:#1F1428;}

.r.on{background:var(--acs);border-color:var(--ac);}
.sw{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.nm{font-size:12px;color:var(--ink);font-weight:500;flex:1;}

.tgl{width:28px;height:16px;border-radius:8px;background:var(--bd);position:relative;}

.tgl::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--f);top:2px;left:2px;}
.r.on .tgl::after{left:14px;}
.btn{width:100%;background:var(--ac);color:#FFFCF7;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:500;cursor:pointer;margin-top:auto;}
.dt{display:flex;gap:6px;justify-content:center;margin-top:12px;}
.d{width:6px;height:6px;border-radius:50%;background:var(--bd);}
.d.on{background:var(--ac);width:18px;border-radius:3px;}
