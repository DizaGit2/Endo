<div id="s2" data-theme="light" style="background:var(--b);border-radius:12px;padding:1.5rem;display:flex;justify-content:center;">
<style>
#s2[data-theme="light"]{--b:#F1EFE8;--f:#FFFCF7;--ink:#3B2A20;--mut:#8A6F5E;--ac:#C25A36;--sg:#7B8F6B;--bd:rgba(59,42,32,.12);--in:#FAF6EF;}
#s2[data-theme="dark"]{--b:#1A1220;--f:#241830;--ink:#F2E4D4;--mut:#A99BB8;--ac:#E8A87C;--sg:#9BAE85;--bd:rgba(242,228,212,.12);--in:#1F1428;}
.f2{width:300px;background:var(--f);border-radius:36px;border:1px solid var(--bd);padding:48px 28px 32px;min-height:560px;position:relative;display:flex;flex-direction:column;}
.tg{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--ink);cursor:pointer;}
.bk{position:absolute;top:18px;left:20px;background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;}
.tag{font-size:11px;color:var(--sg);text-transform:uppercase;letter-spacing:1.5px;font-weight:500;margin:24px 0 14px;}
.h{font-size:22px;font-weight:500;color:var(--ink);margin:0 0 8px;letter-spacing:-.3px;}
.sb{font-size:13px;color:var(--mut);margin:0 0 24px;line-height:1.6;}
.lb{font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:500;}
.ip{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;font-size:14px;color:var(--ink);box-sizing:border-box;font-family:inherit;}
.ip:focus{outline:none;border-color:var(--ac);}
.btn{width:100%;background:var(--ac);color:#FFFCF7;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;margin-top:auto;}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--mut);font-size:11px;}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd);}
.gh{width:100%;background:transparent;color:var(--ink);border:1px solid var(--bd);border-radius:12px;padding:11px;font-size:13px;cursor:pointer;}
.dt{display:flex;gap:6px;justify-content:center;margin-top:14px;}
.d{width:6px;height:6px;border-radius:50%;background:var(--bd);}
.d.on{background:var(--ac);width:18px;border-radius:3px;}
</style>
<div class="f2">
<button class="bk">‹</button>
<button class="tg" onclick="var w=document.getElementById('s2');w.dataset.theme=w.dataset.theme==='light'?'dark':'light';this.textContent=w.dataset.theme==='light'?'☾':'☀';">☾</button>
<div class="tag">Step 2 of 7</div>
<h1 class="h">Create your account</h1>
<p class="sb">Your data is encrypted and yours alone.</p>
<div class="lb">Name</div>
<input class="ip" placeholder="Maya"/>
<div class="lb">Email</div>
<input class="ip" placeholder="you@example.com"/>
<div class="lb">Password</div>
<input class="ip" type="password" placeholder="••••••••"/>
<div class="or">or continue with</div>
<button class="gh">Apple · Google</button>
<button class="btn">Continue</button>
<div class="dt"><span class="d"></span><span class="d on"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span></div>
</div>
</div>
