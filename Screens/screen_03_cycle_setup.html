<div id="s3" data-theme="light" style="background:var(--b);border-radius:12px;padding:1.5rem;display:flex;justify-content:center;">
<style>
#s3[data-theme="light"]{--b:#F1EFE8;--f:#FFFCF7;--ink:#3B2A20;--mut:#8A6F5E;--ac:#C25A36;--acs:#F3D9CC;--sg:#7B8F6B;--bd:rgba(59,42,32,.12);--in:#FAF6EF;}
#s3[data-theme="dark"]{--b:#1A1220;--f:#241830;--ink:#F2E4D4;--mut:#A99BB8;--ac:#E8A87C;--acs:#3A2438;--sg:#9BAE85;--bd:rgba(242,228,212,.12);--in:#1F1428;}
.f{width:300px;background:var(--f);border-radius:36px;border:1px solid var(--bd);padding:48px 24px 28px;min-height:560px;position:relative;display:flex;flex-direction:column;}
.tg{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--ink);cursor:pointer;}
.bk{position:absolute;top:18px;left:20px;background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;}
.tag{font-size:11px;color:var(--sg);text-transform:uppercase;letter-spacing:1.5px;font-weight:500;margin:24px 0 14px;}
.h{font-size:21px;font-weight:500;color:var(--ink);margin:0 0 6px;letter-spacing:-.3px;}
.sb{font-size:12px;color:var(--mut);margin:0 0 18px;line-height:1.5;}
.lb{font-size:11px;color:var(--mut);margin:14px 0 6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
.cal{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px;}
.cm{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink);font-weight:500;margin-bottom:8px;padding:0 4px;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;text-align:center;}
.cd{padding:5px 0;color:var(--ink);border-radius:6px;}
.cd.dim{color:var(--mut);opacity:.4;}
.cd.sel{background:var(--ac);color:#FFFCF7;font-weight:500;}
.cd.r{background:var(--acs);color:var(--ac);}
.row{display:flex;gap:8px;}
.chip{flex:1;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--ink);cursor:pointer;}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:500;}
.btn{width:100%;background:var(--ac);color:#FFFCF7;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:500;cursor:pointer;margin-top:auto;}
.dt{display:flex;gap:6px;justify-content:center;margin-top:12px;}
.d{width:6px;height:6px;border-radius:50%;background:var(--bd);}
.d.on{background:var(--ac);width:18px;border-radius:3px;}
</style>
<div class="f">
<button class="bk">‹</button>
<button class="tg" onclick="var w=document.getElementById('s3');w.dataset.theme=w.dataset.theme==='light'?'dark':'light';this.textContent=w.dataset.theme==='light'?'☾':'☀';">☾</button>
<div class="tag">Step 3 of 7 · Cycle</div>

<span class="cd dim">29</span><span class="cd dim">30</span><span class="cd dim">31</span><span class="cd">1</span><span class="cd">2</span><span class="cd r">3</span><span class="cd r">4</span>
<span class="cd r">5</span><span class="cd sel">6</span><span class="cd r">7</span><span class="cd r">8</span><span class="cd">9</span><span class="cd">10</span><span class="cd">11</span>

</div>
</div>
